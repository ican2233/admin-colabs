<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKS TEAM - Secure Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            background: #1e293b; color: white; padding: 14px 24px;
            border-radius: 18px; font-size: 11px; font-weight: 800; text-transform: uppercase;
            border-left: 5px solid #10b981; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0b0f1a] min-h-screen pb-20 font-sans text-slate-200">

    <div id="toast-container"></div>

    <div id="confirmModal" class="hidden fixed inset-0 z-[110] bg-black/80 backdrop-blur-md flex items-center justify-center px-6">
        <div class="glass-card p-8 rounded-[2.5rem] w-full max-w-xs border-t-4 border-red-500 text-center">
            <h3 class="text-white font-black uppercase italic mb-2">Hapus Data?</h3>
            <p class="text-[10px] opacity-60 mb-6 uppercase">Tindakan ini tidak bisa dibatalkan.</p>
            <div class="flex gap-3">
                <button onclick="closeConfirm()" class="flex-1 bg-slate-800 p-4 rounded-2xl font-black text-[10px] uppercase">Batal</button>
                <button id="finalDeleteBtn" class="flex-1 bg-red-600 p-4 rounded-2xl font-black text-[10px] uppercase shadow-lg shadow-red-600/20">Hapus</button>
            </div>
        </div>
    </div>

    <div id="loginScreen" class="fixed inset-0 z-[100] bg-[#0b0f1a] flex items-center justify-center px-4">
        <div class="glass-card p-8 rounded-[2.5rem] w-full max-w-sm border-t-4 border-blue-500 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-user-shield text-2xl text-white"></i>
                </div>
                <h2 class="text-xl font-black italic uppercase italic">TKS Portal Access</h2>
            </div>
            <div class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Admin Email" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all">
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all">
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl font-black text-xs uppercase transition-all active:scale-95">Login System</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="bg-gradient-to-r from-blue-700 to-indigo-900 p-8 shadow-2xl mb-6 rounded-b-[3rem] text-center relative overflow-hidden">
            <button onclick="doLogout()" class="absolute right-6 top-6 text-white/50 hover:text-white transition-colors z-10"><i class="fa-solid fa-power-off"></i></button>
            <div class="relative z-10">
                <h1 class="text-2xl font-black italic text-white uppercase tracking-tighter">TKS Dashboard</h1>
                <p id="userRoleBadge" class="text-[9px] font-bold opacity-70 tracking-widest mt-1 uppercase"></p>
            </div>
        </header>
        
        <div class="max-w-md mx-auto px-4">
            <div id="adminTabNav" class="hidden flex gap-2 mb-6 bg-black/20 p-2 rounded-3xl">
                <button onclick="switchTab('users')" id="tab-users" class="flex-1 p-3 rounded-2xl bg-blue-600 text-[10px] font-black uppercase italic transition-all">Users</button>
                <button onclick="switchTab('admins')" id="tab-admins" class="flex-1 p-3 rounded-2xl bg-slate-800 text-[10px] font-black uppercase italic transition-all">Admin</button>
                <button onclick="switchTab('broadcast')" id="tab-broadcast" class="flex-1 p-3 rounded-2xl bg-slate-800 text-[10px] font-black uppercase italic transition-all">Notif</button>
            </div>

            <div id="usersTab">
                <div class="glass-card p-6 rounded-[2.5rem] shadow-2xl mb-8 border-l-8 border-emerald-500">
                    <h2 id="formTitle" class="text-emerald-400 font-black text-xs mb-6 uppercase tracking-widest flex items-center italic">
                        <i class="fa-solid fa-user-plus mr-2"></i> User Editor
                    </h2>
                    <div class="space-y-4">
                        <input type="text" id="field_id" placeholder="Device ID" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none focus:border-emerald-500 transition-all">
                        <input type="text" id="field_username" placeholder="Username" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none focus:border-emerald-500 transition-all">
                        <input type="text" id="field_password" placeholder="Password" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none focus:border-emerald-500 transition-all">
                        <div class="flex flex-col">
                            <label class="text-[9px] text-emerald-500 font-black ml-2 mb-1 uppercase italic">Masa Aktif User</label>
                            <input type="date" id="field_expiry" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none">
                        </div>
                        <div class="bg-black/40 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                            <span class="text-[10px] font-black uppercase text-slate-500">Allow Offline</span>
                            <select id="field_offline" class="bg-blue-600 text-white font-bold text-[10px] px-3 py-1 rounded-lg outline-none">
                                <option value="true">ENABLE</option>
                                <option value="false">DISABLE</option>
                            </select>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button id="cancelBtn" onclick="clearForm()" class="hidden flex-1 bg-slate-700 p-4 rounded-2xl font-black text-xs uppercase">Batal</button>
                            <button onclick="saveUserData()" class="flex-[2] bg-emerald-600 p-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-emerald-600/20 active:scale-95 transition-all">Simpan User</button>
                        </div>
                    </div>
                </div>

                <div class="mb-4 flex justify-between items-center px-4">
                    <h3 class="font-black text-xs uppercase italic text-slate-500">User List (<span id="countUsers">0</span>)</h3>
                    <div class="relative">
                        <input type="text" id="userSearch" onkeyup="renderUsers()" placeholder="Search ID/Name..." class="bg-black/20 border-b border-slate-700 text-xs outline-none w-32 px-2 py-1 italic">
                    </div>
                </div>
                <div id="userList" class="space-y-4"></div>
            </div>

            <div id="adminsTab" class="hidden">
                <div class="glass-card p-6 rounded-[2.5rem] shadow-2xl mb-8 border-l-8 border-amber-500">
                    <h2 id="admFormTitle" class="text-amber-400 font-black text-xs mb-6 uppercase tracking-widest italic flex items-center">
                        <i class="fa-solid fa-crown mr-2"></i> Admin Editor
                    </h2>
                    <div class="space-y-4">
                        <input type="email" id="adm_email" placeholder="Email Admin" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none focus:border-amber-500 transition-all">
                        <input type="text" id="adm_pass" placeholder="Password Admin" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none focus:border-amber-500 transition-all">
                        <div class="flex flex-col">
                            <label class="text-[9px] text-amber-400 font-black ml-2 mb-1 uppercase italic">Masa Aktif Admin</label>
                            <input type="date" id="adm_expiry" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none">
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button id="admCancelBtn" onclick="clearAdminForm()" class="hidden flex-1 bg-slate-700 p-4 rounded-2xl font-black text-xs uppercase">Batal</button>
                            <button onclick="saveAdminData()" class="flex-[2] bg-amber-600 p-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-amber-600/20 active:scale-95 transition-all">Simpan Admin</button>
                        </div>
                    </div>
                </div>
                <div id="adminList" class="space-y-4"></div>
            </div>

            <div id="broadcastTab" class="hidden">
                <div class="glass-card p-6 rounded-[2.5rem] shadow-2xl mb-8 border-l-8 border-purple-500">
                    <h2 class="text-purple-400 font-black text-xs mb-6 uppercase tracking-widest italic flex items-center">
                        <i class="fa-solid fa-bullhorn mr-2"></i> Broadcast News
                    </h2>
                    <div class="space-y-4">
                        <textarea id="notif_msg" placeholder="Ketik pesan untuk semua pengguna di aplikasi..." class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none h-32 focus:border-purple-500 transition-all"></textarea>
                        <div class="bg-black/40 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                            <span class="text-[10px] font-black uppercase text-slate-500">Status Notif</span>
                            <select id="notif_status" class="bg-purple-600 text-white font-bold text-[10px] px-3 py-1 rounded-lg outline-none">
                                <option value="true">TAMPILKAN</option>
                                <option value="false">SEMBUNYIKAN</option>
                            </select>
                        </div>
                        <button onclick="sendBroadcast()" class="w-full bg-purple-600 p-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-purple-600/20 active:scale-95 transition-all">Update Server</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- CONFIG ---
        const OWNER_EMAIL = "suwandiikhsan1@gmail.com";
        const firebaseConfig = { databaseURL: "https://panel-2a2fd-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('tks_session'));
        let userRecords = [];
        let adminRecords = [];
        let editingIndex = -1;
        let editingAdminIndex = -1;

        window.onload = () => { if(currentUser) showDashboard(); };

        // --- AUTH ---
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const today = new Date().toISOString().split('T')[0];

            if (!email || !pass) return showToast("Email & Password Required!", "error");

            const snap = await db.ref('AdminAccount').once('value');
            const data = snap.val();
            let admins = data ? Object.values(data) : [];
            
            const found = admins.find(a => a && a.email === email && a.pass === pass);

            if (found) {
                if (email !== OWNER_EMAIL) {
                    if (found.expiry && today > found.expiry) return showToast("Account Expired!", "error");
                }
                loginSuccess(email, (email === OWNER_EMAIL ? "SUPER_ADMIN" : "ADMIN"));
            } else {
                showToast("Invalid Credentials!", "error");
            }
        }

        function loginSuccess(email, role) {
            currentUser = { email, role };
            localStorage.setItem('tks_session', JSON.stringify(currentUser));
            showDashboard();
        }

        function doLogout() { localStorage.clear(); location.reload(); }

        // --- UI CORE ---
        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('userRoleBadge').innerText = `${currentUser.email} (${currentUser.role})`;

            if(currentUser.role === "SUPER_ADMIN") {
                document.getElementById('adminTabNav').classList.remove('hidden');
                loadAdminData();
                loadCurrentNotif();
            }
            loadUserData();
        }

        function switchTab(tab) {
            document.getElementById('usersTab').classList.toggle('hidden', tab !== 'users');
            document.getElementById('adminsTab').classList.toggle('hidden', tab !== 'admins');
            document.getElementById('broadcastTab').classList.toggle('hidden', tab !== 'broadcast');

            document.getElementById('tab-users').className = tab === 'users' ? 'flex-1 p-3 rounded-2xl bg-blue-600 text-[10px] font-black uppercase italic' : 'flex-1 p-3 rounded-2xl bg-slate-800 text-[10px] font-black uppercase italic';
            document.getElementById('tab-admins').className = tab === 'admins' ? 'flex-1 p-3 rounded-2xl bg-amber-600 text-[10px] font-black uppercase italic' : 'flex-1 p-3 rounded-2xl bg-slate-800 text-[10px] font-black uppercase italic';
            document.getElementById('tab-broadcast').className = tab === 'broadcast' ? 'flex-1 p-3 rounded-2xl bg-purple-600 text-[10px] font-black uppercase italic' : 'flex-1 p-3 rounded-2xl bg-slate-800 text-[10px] font-black uppercase italic';
        }

        // --- USER MGMT ---
        function loadUserData() {
            db.ref('users').on('value', (snap) => {
                const data = snap.val();
                userRecords = data ? Object.values(data) : [];
                renderUsers();
            });
        }

        function renderUsers() {
            const list = document.getElementById('userList');
            const q = document.getElementById('userSearch').value.toLowerCase();
            list.innerHTML = '';
            let count = 0;

            userRecords.forEach((u, i) => {
                if(!u) return;
                if(q && !u.username.toLowerCase().includes(q) && !u.id.toLowerCase().includes(q)) return;
                count++;
                list.innerHTML += `
                    <div class="glass-card p-5 rounded-[2rem] border-l-4 ${u.allowOffline ? 'border-emerald-500' : 'border-slate-700'} relative overflow-hidden">
                        <div class="flex justify-between items-start relative z-10">
                            <div>
                                <h4 class="font-black text-white italic uppercase text-sm">${u.username}</h4>
                                <p class="text-[9px] opacity-40 font-mono tracking-tighter">${u.id}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editUser(${i})" class="text-blue-400 p-2 bg-blue-400/10 rounded-xl hover:bg-blue-400/20"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deletePrompt('users', ${i})" class="text-red-400 p-2 bg-red-400/10 rounded-xl hover:bg-red-400/20"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="mt-4 flex justify-between items-center relative z-10">
                            <span class="bg-black/40 px-3 py-1 rounded-full text-[9px] text-amber-400 font-black border border-white/5 uppercase">Exp: ${u.expiresAt || 'Lifetime'}</span>
                            <span class="text-[9px] font-black uppercase ${u.allowOffline ? 'text-emerald-400' : 'text-slate-600'}">Offline: ${u.allowOffline}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('countUsers').innerText = count;
        }

        async function saveUserData() {
            const data = {
                id: document.getElementById('field_id').value.trim(),
                username: document.getElementById('field_username').value.trim(),
                password: document.getElementById('field_password').value.trim(),
                expiresAt: document.getElementById('field_expiry').value,
                allowOffline: document.getElementById('field_offline').value === 'true'
            };

            if(!data.id || !data.username) return showToast("Fill all fields!", "error");

            if(editingIndex > -1) userRecords[editingIndex] = data;
            else userRecords.push(data);

            await db.ref('users').set(userRecords);
            showToast(editingIndex > -1 ? "User Updated" : "User Added");
            clearForm();
        }

        function editUser(i) {
            const u = userRecords[i];
            editingIndex = i;
            document.getElementById('field_id').value = u.id;
            document.getElementById('field_username').value = u.username;
            document.getElementById('field_password').value = u.password || '';
            document.getElementById('field_expiry').value = u.expiresAt || '';
            document.getElementById('field_offline').value = String(u.allowOffline);
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-user-pen mr-2"></i> Update User';
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // --- ADMIN MGMT ---
        function loadAdminData() {
            db.ref('AdminAccount').on('value', (snap) => {
                const list = document.getElementById('adminList');
                list.innerHTML = '';
                const data = snap.val();
                adminRecords = data ? Object.values(data) : [];
                
                adminRecords.forEach((adm, i) => {
                    if(!adm) return;
                    list.innerHTML += `
                        <div class="glass-card p-4 rounded-2xl flex justify-between items-center border border-white/5">
                            <div>
                                <p class="text-[10px] font-black text-white italic uppercase">${adm.email}</p>
                                <p class="text-[9px] opacity-40 uppercase">Expires: ${adm.expiry || 'No Limit'}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editAdmin(${i})" class="text-amber-400 p-2 hover:bg-amber-400/10 rounded-lg"><i class="fa-solid fa-pen-nib text-xs"></i></button>
                                <button onclick="deletePrompt('AdminAccount', ${i})" class="text-red-400 p-2 hover:bg-red-400/10 rounded-lg"><i class="fa-solid fa-user-xmark text-xs"></i></button>
                            </div>
                        </div>`;
                });
            });
        }

        async function saveAdminData() {
            const email = document.getElementById('adm_email').value.trim();
            const pass = document.getElementById('adm_pass').value.trim();
            const expiry = document.getElementById('adm_expiry').value;

            if(!email || !pass || !expiry) return showToast("Incomplete Data!", "error");

            const newAdm = { email, pass, expiry };
            if(editingAdminIndex > -1) adminRecords[editingAdminIndex] = newAdm;
            else adminRecords.push(newAdm);

            await db.ref('AdminAccount').set(adminRecords);
            showToast("Admin Settings Saved");
            clearAdminForm();
        }

        function editAdmin(i) {
            const adm = adminRecords[i];
            editingAdminIndex = i;
            document.getElementById('adm_email').value = adm.email;
            document.getElementById('adm_pass').value = adm.pass;
            document.getElementById('adm_expiry').value = adm.expiry || '';
            document.getElementById('admFormTitle').innerHTML = '<i class="fa-solid fa-user-gear mr-2"></i> Update Admin';
            document.getElementById('admCancelBtn').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // --- BROADCAST ---
        async function sendBroadcast() {
            const msg = document.getElementById('notif_msg').value;
            const status = document.getElementById('notif_status').value === 'true';
            if(!msg && status) return showToast("Empty Message!", "error");
            await db.ref('app_settings/notification').set({ message: msg, active: status, updatedAt: new Date().toLocaleString() });
            showToast("Server Broadcast Updated");
        }

        function loadCurrentNotif() {
            db.ref('app_settings/notification').once('value', (snap) => {
                const d = snap.val();
                if(d) {
                    document.getElementById('notif_msg').value = d.message || '';
                    document.getElementById('notif_status').value = String(d.active);
                }
            });
        }

        // --- HELPERS ---
        function deletePrompt(path, index) {
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('finalDeleteBtn').onclick = async () => {
                const snap = await db.ref(path).once('value');
                let items = snap.val() ? Object.values(snap.val()) : [];
                items.splice(index, 1);
                
                // Proteksi: Jangan set jika data jadi kosong total (mencegah folder hilang)
                // Jika ingin benar-benar kosong, gunakan .set(null)
                await db.ref(path).set(items.length > 0 ? items : null);
                
                closeConfirm();
                showToast("Record Deleted", "error");
            };
        }

        function closeConfirm() { document.getElementById('confirmModal').classList.add('hidden'); }
        
        function clearForm() {
            editingIndex = -1;
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> User Editor';
            document.getElementById('cancelBtn').classList.add('hidden');
            document.querySelectorAll('#usersTab input').forEach(i => i.value = '');
        }

        function clearAdminForm() {
            editingAdminIndex = -1;
            document.getElementById('admFormTitle').innerHTML = '<i class="fa-solid fa-crown mr-2"></i> Admin Editor';
            document.getElementById('admCancelBtn').classList.add('hidden');
            document.querySelectorAll('#adminsTab input').forEach(i => i.value = '');
        }

        function showToast(msg, type="success") {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast border-l-4 ${type === 'error' ? 'border-red-500' : 'border-emerald-500'}`;
            t.innerText = msg;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 2500);
        }
    </script>
</body>
</html>
