<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKS PORTAL - SECURE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        .glass-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; background: #1e293b; color: white; padding: 12px 20px; border-radius: 12px; font-size: 10px; font-weight: bold; border-left: 4px solid #3b82f6; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-[#05070a] text-slate-300 min-h-screen">

    <div id="toast-container"></div>

    <div id="loginScreen" class="fixed inset-0 z-[100] bg-[#05070a] flex items-center justify-center p-6">
        <div class="glass-card p-8 rounded-[2rem] w-full max-w-sm border-t-2 border-blue-500">
            <h2 class="text-center text-xl font-black italic uppercase text-white mb-6">Admin Login</h2>
            <div class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email Admin" class="w-full p-4 bg-black/40 border border-slate-800 rounded-xl outline-none focus:border-blue-500">
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 bg-black/40 border border-slate-800 rounded-xl outline-none focus:border-blue-500">
                <button onclick="handleLogin()" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase text-xs">Authorize</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="p-6 border-b border-white/5 flex justify-between items-center">
            <h1 class="font-black italic text-white uppercase tracking-tighter">TKS Dashboard</h1>
            <button onclick="doLogout()" class="text-slate-500"><i class="fa-solid fa-right-from-bracket"></i></button>
        </header>

        <main class="p-4 max-w-lg mx-auto">
            <div class="glass-card p-6 rounded-[2rem] mb-6 border-l-4 border-emerald-500">
                <input type="text" id="f_id" placeholder="Device ID" class="w-full p-3 bg-black/20 border border-slate-800 rounded-lg mb-3 text-sm">
                <input type="text" id="f_user" placeholder="Username" class="w-full p-3 bg-black/20 border border-slate-800 rounded-lg mb-3 text-sm">
                <input type="text" id="f_pass" placeholder="Password" class="w-full p-3 bg-black/20 border border-slate-800 rounded-lg mb-3 text-sm">
                <input type="date" id="f_exp" class="w-full p-3 bg-black/20 border border-slate-800 rounded-lg mb-4 text-sm">
                <button onclick="saveUser()" class="w-full bg-emerald-600 p-3 rounded-lg font-bold uppercase text-[10px]">Simpan User</button>
            </div>

            <h2 class="font-black uppercase text-xs mb-4 text-slate-500">User List (<span id="count">0</span>)</h2>
            <div id="userList" class="space-y-3"></div>
        </main>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://panel-2a2fd-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // Cek Status Login
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainContent').classList.add('hidden');
            }
        });

        async function handleLogin() {
            const e = document.getElementById('loginEmail').value;
            const p = document.getElementById('loginPass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } 
            catch (err) { alert("Login Gagal: " + err.message); }
        }

        function doLogout() { auth.signOut(); }

        function loadData() {
            db.ref('users').on('value', snap => {
                const list = document.getElementById('userList');
                list.innerHTML = '';
                let i = 0;
                snap.forEach(child => {
                    const u = child.val();
                    const key = child.key; // Ini bisa berupa '0' atau 'Icancan' atau Device ID
                    i++;
                    list.innerHTML += `
                        <div class="glass-card p-4 rounded-2xl flex justify-between items-center">
                            <div>
                                <p class="text-white font-bold text-sm">${u.username || 'No Name'}</p>
                                <p class="text-[9px] opacity-50">${u.id || key}</p>
                            </div>
                            <button onclick="deleteUser('${key}')" class="text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                });
                document.getElementById('count').innerText = i;
            });
        }

        async function saveUser() {
            const id = document.getElementById('f_id').value;
            if(!id) return alert("ID Wajib!");
            const data = {
                id: id,
                username: document.getElementById('f_user').value,
                password: document.getElementById('f_pass').value,
                expiresAt: document.getElementById('f_exp').value,
                allowOffline: true
            };
            // Kita simpan dengan Device ID sebagai Key agar rapi (tidak pakai 0, 1, 2)
            await db.ref('users/' + id).set(data);
            alert("Berhasil!");
        }

        async function deleteUser(key) {
            if(confirm("Hapus user ini?")) {
                await db.ref('users/' + key).remove();
            }
        }
    </script>
</body>
</html>
