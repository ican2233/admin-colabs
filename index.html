<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKS TEAM - Secure Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            background: rgba(15, 23, 42, 0.95); color: white; padding: 14px 24px;
            border-radius: 18px; font-size: 11px; font-weight: 800; text-transform: uppercase;
            border-left: 5px solid #10b981; animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-[#0b0f1a] min-h-screen pb-20 font-sans text-slate-200">

    <div id="toast-container"></div>
    
    <div id="confirmModal" class="hidden fixed inset-0 z-[110] bg-black/80 backdrop-blur-md flex items-center justify-center px-6">
        <div class="glass-card p-8 rounded-[2.5rem] w-full max-w-xs border-t-4 border-red-500 text-center">
            <h3 class="text-white font-black uppercase italic mb-2 text-lg">Hapus Data?</h3>
            <p class="text-[10px] text-slate-400 mb-4 uppercase tracking-widest">Data akan hilang permanen dari Firebase.</p>
            <div class="flex gap-3 mt-6">
                <button onclick="closeConfirm()" class="flex-1 bg-slate-800 p-4 rounded-2xl font-black text-[10px] uppercase">Batal</button>
                <button id="finalDeleteBtn" class="flex-1 bg-red-600 p-4 rounded-2xl font-black text-[10px] uppercase">Hapus</button>
            </div>
        </div>
    </div>

    <div id="loginScreen" class="fixed inset-0 z-[100] bg-[#0b0f1a] flex items-center justify-center px-4">
        <div class="glass-card p-8 rounded-[2.5rem] w-full max-w-sm border-t-4 border-blue-500 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-shield-halved text-2xl text-white"></i>
                </div>
                <h2 class="text-xl font-black italic uppercase tracking-tighter text-white">Secure Access</h2>
            </div>
            <div class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email Admin" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all">
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none focus:border-blue-500 transition-all">
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl font-black text-xs uppercase transition">Verify & Entry</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="bg-gradient-to-br from-blue-700 via-indigo-900 to-slate-900 p-8 shadow-2xl mb-6 rounded-b-[3.5rem] text-center relative border-b border-white/5">
            <button onclick="doLogout()" class="absolute right-8 top-8 text-white/30 hover:text-white transition-colors"><i class="fa-solid fa-power-off text-lg"></i></button>
            <h1 class="text-3xl font-black italic text-white uppercase tracking-tighter mb-1">TKS Dashboard</h1>
            <p id="userRoleBadge" class="text-[10px] font-bold text-blue-300 tracking-[0.2em] uppercase opacity-80"></p>
        </header>

        <div class="max-w-md mx-auto px-4">
            <div id="adminTabNav" class="hidden flex gap-2 mb-8">
                <button onclick="switchTab('users')" id="tab-users" class="flex-1 p-3 rounded-2xl bg-blue-600 text-[10px] font-black uppercase italic tracking-wider transition-all">Users</button>
                <button onclick="switchTab('admins')" id="tab-admins" class="flex-1 p-3 rounded-2xl bg-slate-800 text-[10px] font-black uppercase italic tracking-wider transition-all text-slate-400">Settings</button>
                <button onclick="switchTab('broadcast')" id="tab-broadcast" class="flex-1 p-3 rounded-2xl bg-slate-800 text-[10px] font-black uppercase italic tracking-wider transition-all text-slate-400">Notif</button>
            </div>

            <div id="usersTab">
                <div class="glass-card p-6 rounded-[2.5rem] shadow-2xl mb-8 border-l-8 border-emerald-500">
                    <h2 id="formTitle" class="text-emerald-400 font-black text-[11px] mb-6 uppercase tracking-widest flex items-center italic">
                        <i class="fa-solid fa-id-card mr-2 text-lg"></i> User Editor
                    </h2>
                    <div class="space-y-4">
                        <input type="text" id="field_id" placeholder="Device ID" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none">
                        <input type="text" id="field_username" placeholder="Nama User" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none">
                        <input type="text" id="field_password" placeholder="Password" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none">
                        <input type="date" id="field_expiry" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none">
                        <select id="field_offline" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm outline-none appearance-none">
                            <option value="true">IZIN OFFLINE: YA</option>
                            <option value="false">IZIN OFFLINE: TIDAK</option>
                        </select>
                        <button onclick="saveUserData()" class="w-full bg-emerald-600 p-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-emerald-900/30">Simpan Database</button>
                    </div>
                </div>

                <div class="mb-6 flex justify-between items-end px-2">
                    <h3 class="font-black text-lg italic text-white uppercase">User List (<span id="countUsers" class="text-blue-500">0</span>)</h3>
                    <input type="text" id="userSearch" onkeyup="renderUsers()" placeholder="CARI..." class="bg-slate-800/50 border border-slate-700 p-2 rounded-xl text-[10px] font-black outline-none w-32 uppercase">
                </div>
                <div id="userList" class="space-y-4"></div>
            </div>

            <div id="adminsTab" class="hidden">... (Admin Management) ...</div>
             <div id="broadcastTab" class="hidden">... (Notification System) ...</div>
        </div>
    </div>

    <script>
        const SUPER_ADMIN_EMAIL = "suwandiikhsan1@gmail.com";
        const firebaseConfig = { 
            // Tambahkan API Key kamu di sini jika diperlukan dari Firebase Console Settings
            databaseURL: "https://panel-2a2fd-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        
        const db = firebase.database();
        const auth = firebase.auth();

        let userRecords = [];

        // Deteksi Perubahan Status Login (PENTING UNTUK RULES)
        auth.onAuthStateChanged((user) => {
            if (user) {
                showDashboard(user.email);
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainContent').classList.add('hidden');
            }
        });

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if (!email || !pass) return showToast("Wajib diisi!", "error");

            try {
                // Proses Otentikasi Resmi Firebase
                await auth.signInWithEmailAndPassword(email, pass);
                showToast("Identity Verified");
            } catch (e) {
                console.error(e);
                showToast("Akses Ditolak: " + e.message, "error");
            }
        }

        function showDashboard(email) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('userRoleBadge').innerText = `ACCESS: ${email}`;

            if(email === SUPER_ADMIN_EMAIL) {
                document.getElementById('adminTabNav').classList.remove('hidden');
            }
            loadUserData();
        }

        function doLogout() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        function loadUserData() {
            // Ini akan berhasil karena auth != null (sudah login resmi)
            db.ref('users').on('value', (snapshot) => {
                const data = snapshot.val();
                userRecords = data ? Object.entries(data).map(([key, val]) => ({...val, firebaseKey: key})) : [];
                renderUsers();
            }, (error) => {
                showToast("Akses Data Diblokir!", "error");
            });
        }

        // --- FUNGSI RENDER, SAVE, DELETE TETAP SAMA ---
        // (Gunakan logika renderUsers, saveUserData, dan deletePrompt dari kode sebelumnya)

        function renderUsers() {
            const list = document.getElementById('userList');
            const query = document.getElementById('userSearch').value.toLowerCase();
            list.innerHTML = '';
            let count = 0;

            userRecords.forEach((u) => {
                if(!u.id) return;
                if(query && !u.username.toLowerCase().includes(query)) return;
                count++;
                list.innerHTML += `
                    <div class="glass-card p-5 rounded-[2rem] border-l-4 ${u.allowOffline ? 'border-emerald-500' : 'border-slate-700'}">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-black text-white italic uppercase">${u.username}</h4>
                                <p class="text-[9px] opacity-40 font-mono italic">${u.id}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="deletePrompt('users', '${u.firebaseKey}')" class="text-red-400 p-2.5 bg-red-400/5 rounded-xl"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('countUsers').innerText = count;
        }

        function showToast(msg, type="success") {
            const t = document.createElement('div');
            t.className = `toast ${type === 'error' ? 'border-red-600' : 'border-blue-500'}`;
            t.innerHTML = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function deletePrompt(path, identifier) {
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('finalDeleteBtn').onclick = async () => {
                await db.ref('users/' + identifier).remove();
                document.getElementById('confirmModal').classList.add('hidden');
                showToast("User Deleted", "error");
            };
        }
        
        function closeConfirm() { document.getElementById('confirmModal').classList.add('hidden'); }
    </script>
</body>
</html>
